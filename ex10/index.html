<!DOCTYPE html>
<html>

<head>

    <title>Student Dashboard</title>

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>


    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }


        /* NAVBAR */

        .navbar {
            background: #111827;
            color: white;

            padding: 18px 7%;

            display: flex;
            justify-content: space-between;
            align-items: center;
        }


        .logo {
            font-size: 24px;
            font-weight: bold;
        }


        .logo span {
            color: #38bdf8;
        }


        .nav-links {
            display: flex;
            gap: 25px;
        }


        .nav-links a {
            color: #d1d5db;
            text-decoration: none;
        }


        .nav-links a:hover {
            color: white;
        }


        /* HERO */

        .hero {
            background: linear-gradient(
                135deg,
                #0f172a,
                #1e3a5f
            );

            color: white;

            padding: 55px 7%;
        }


        .hero h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }


        .hero p {
            color: #cbd5e1;
            font-size: 17px;
        }


        /* MAIN */

        .container {
            width: 86%;
            max-width: 1200px;

            margin: 35px auto;
        }


        /* STAT CARDS */

        .stats {
            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(200px, 1fr));

            gap: 20px;

            margin-bottom: 30px;
        }


        .stat-card {
            background: white;

            padding: 25px;

            border-radius: 12px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.07);
        }


        .stat-card h3 {
            color: #64748b;
            font-size: 14px;

            margin-bottom: 10px;
        }


        .stat-card p {
            font-size: 30px;
            font-weight: bold;

            color: #1e3a5f;
        }


        /* CONTROL BOX */

        .control-box {
            background: white;

            padding: 22px;

            border-radius: 12px;

            display: flex;

            justify-content: space-between;

            align-items: center;

            gap: 15px;

            margin-bottom: 30px;

            box-shadow:
                0 4px 15px rgba(0,0,0,0.07);
        }


        .search {
            flex: 1;

            padding: 13px 16px;

            border: 1px solid #d1d5db;

            border-radius: 8px;

            font-size: 15px;
        }


        .search:focus {
            outline: none;

            border-color: #38bdf8;
        }


        .load-btn {
            padding: 13px 25px;

            background: #2563eb;

            color: white;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-size: 15px;

            font-weight: bold;
        }


        .load-btn:hover {
            background: #1d4ed8;
        }


        /* STUDENT GRID */

        #studentContainer {

            display: grid;

            grid-template-columns:
                repeat(auto-fit, minmax(260px, 1fr));

            gap: 22px;
        }


        /* STUDENT CARD */

        .student-card {

            background: white;

            padding: 25px;

            border-radius: 14px;

            box-shadow:
                0 5px 18px rgba(0,0,0,0.08);

            transition: 0.3s;

            border: 1px solid #eef2f7;
        }


        .student-card:hover {
            transform: translateY(-6px);
        }


        .avatar {

            width: 55px;
            height: 55px;

            border-radius: 50%;

            background: #dbeafe;

            color: #1d4ed8;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 20px;

            font-weight: bold;

            margin-bottom: 18px;
        }


        .student-card h2 {

            color: #111827;

            margin-bottom: 15px;
        }


        .student-card p {

            color: #64748b;

            margin: 8px 0;

            line-height: 1.5;
        }


        .student-card strong {

            color: #334155;
        }


        .department {

            display: inline-block;

            margin-top: 12px;

            padding: 6px 10px;

            background: #eff6ff;

            color: #2563eb;

            border-radius: 20px;

            font-size: 13px;
        }


        /* MESSAGE */

        .message {

            grid-column: 1 / -1;

            text-align: center;

            padding: 50px;

            background: white;

            border-radius: 12px;

            color: #64748b;
        }


        /* FOOTER */

        footer {

            margin-top: 60px;

            background: #111827;

            color: #94a3b8;

            text-align: center;

            padding: 25px;
        }


        /* MOBILE */

        @media(max-width: 600px) {

            .navbar {
                padding: 18px 5%;
            }

            .nav-links {
                display: none;
            }

            .hero {
                padding: 40px 5%;
            }

            .hero h1 {
                font-size: 30px;
            }

            .container {
                width: 92%;
            }

            .control-box {
                flex-direction: column;
            }

            .search {
                width: 100%;
            }

            .load-btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <!-- NAVBAR -->

    <header class="navbar">

        <div class="logo">
            Student<span>Hub</span>
        </div>


        <nav class="nav-links">

            <a href="#">Dashboard</a>

            <a href="#">Students</a>

            <a href="#">About</a>

        </nav>

    </header>



    <!-- HERO -->

    <section class="hero">

        <h1>Student Dashboard</h1>

        <p>
            Manage and explore student information
            using jQuery, AJAX and JSON.
        </p>

    </section>



    <!-- MAIN -->

    <main class="container">


        <!-- STATISTICS -->

        <section class="stats">

            <div class="stat-card">

                <h3>TOTAL STUDENTS</h3>

                <p id="totalStudents">
                    0
                </p>

            </div>


            <div class="stat-card">

                <h3>DATA SOURCE</h3>

                <p style="font-size:20px;">
                    JSON
                </p>

            </div>


            <div class="stat-card">

                <h3>TECHNOLOGY</h3>

                <p style="font-size:20px;">
                    jQuery AJAX
                </p>

            </div>

        </section>



        <!-- SEARCH -->

        <section class="control-box">

            <input
                type="text"
                id="search"
                class="search"
                placeholder="Search student by name..."
            >


            <button
                id="loadBtn"
                class="load-btn"
            >

                Load Students

            </button>

        </section>



        <!-- STUDENTS -->

        <section id="studentContainer">

            <div class="message">

                Click <b>Load Students</b>
                to retrieve JSON data.

            </div>

        </section>


    </main>



    <!-- FOOTER -->

    <footer>

        <p>
            Internet and Web Technology Lab
        </p>

    </footer>



    <!-- jQUERY + AJAX -->

    <script>

        /* Store students */

        var students = [];



        /* When webpage is ready */

        $(document).ready(function() {



            /* Load button */

            $("#loadBtn").click(function() {


                $.ajax({

                    url: "students.json",

                    type: "GET",


                    /* Success */

                    success: function(data) {


                        /* Store JSON data */

                        students = data;


                        /* Show total */

                        $("#totalStudents")
                            .text(data.length);


                        /* Display students */

                        displayStudents(data);

                    },


                    /* Error */

                    error: function() {

                        $("#studentContainer").html(

                            "<div class='message'>" +

                            "Unable to load student data." +

                            "</div>"

                        );

                    }

                });

            });



            /* Search */

            $("#search").keyup(function() {


                var value =
                    $(this)
                    .val()
                    .toLowerCase()
                    .trim();


                var filtered =
                    students.filter(
                        function(student) {

                            return student.name
                                .toLowerCase()
                                .includes(value);

                        }
                    );


                displayStudents(filtered);

            });



        });



        /* DISPLAY STUDENTS */

        function displayStudents(data) {


            $("#studentContainer").html("");


            /* No result */

            if (data.length == 0) {

                $("#studentContainer").html(

                    "<div class='message'>" +

                    "No student found." +

                    "</div>"

                );

                return;

            }


            /* Loop through data */

            $.each(data, function(index, student) {


                /* First letter */

                var firstLetter =
                    student.name
                    .charAt(0)
                    .toUpperCase();


                /* Create card */

                var card =

                    "<div class='student-card'>" +

                        "<div class='avatar'>" +

                            firstLetter +

                        "</div>" +


                        "<h2>" +

                            student.name +

                        "</h2>" +


                        "<p>" +

                            "<strong>Email:</strong><br>" +

                            student.email +

                        "</p>" +


                        "<p>" +

                            "<strong>Phone:</strong><br>" +

                            student.phone +

                        "</p>" +


                        "<p>" +

                            "<strong>College:</strong><br>" +

                            student.college +

                        "</p>" +


                        "<span class='department'>" +

                            student.department +

                        "</span>" +


                    "</div>";


                /* Add card */

                $("#studentContainer")
                    .append(card);


            });

        }

    </script>


</body>

</html>
