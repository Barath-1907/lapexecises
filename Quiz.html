<body>

<div class="quiz-container">

    <h1>📝 Quiz Application</h1>

    <div class="question-box">
        <h2 id="question">
            What does HTML stand for?
        </h2>
    </div>

 

<div class="options">
    <button id="op1"></button>
    <button id="op2"></button>
    <button id="op3"></button>
    <button id="op4"></button>
</div>

<button class="next-btn" onclick="nextQuestion()">
    Next Question →
</button>
<script>

const questions = [
{
    question:"What does CPU stand for?",
    options:["Central Process Unit","Central Processing Unit","Computer Processing Unit","Control Processing Unit"]
},
{
    question:"Which language is used to create web pages?",
    options:["Python","HTML","Java","C++"]
},
{
    question:"Which language is used for styling web pages?",
    options:["CSS","Java","Python","C++"]
},
{
    question:"Which language is used to make web pages interactive?",
    options:["JavaScript","Python","Java","SQL"]
},
{
    question:"Which database is used in the MERN Stack?",
    options:["MongoDB","MySQL","Oracle","SQLite"]
},
{
    question:"Which tag creates a hyperlink?",
    options:["<a>","<img>","<div>","<p>"]
},
{
    question:"What does RAM stand for?",
    options:["Random Access Memory","Read Access Memory","Rapid Access Memory","Run Access Memory"]
},
{
    question:"Which is an operating system?",
    options:["Linux","Chrome","Google","Oracle"]
},
{
    question:"Which data structure follows FIFO?",
    options:["Queue","Stack","Tree","Graph"]
},
{
    question:"Which data structure follows LIFO?",
    options:["Stack","Queue","Array","Tree"]
},
{
    question:"What does SQL stand for?",
    options:["Structured Query Language","Simple Query Language","System Query Language","Sequential Query Language"]
},
{
    question:"Which company developed Java?",
    options:["Sun Microsystems","Google","Microsoft","IBM"]
},
{
    question:"Which CSS property changes text color?",
    options:["color","font","background","size"]
},
{
    question:"Which HTML tag displays an image?",
    options:["<img>","<image>","<picture>","<src>"]
},
{
    question:"Which protocol is used for websites?",
    options:["HTTP","FTP","SMTP","POP3"]
},
{
    question:"Which search algorithm requires sorted data?",
    options:["Binary Search","Linear Search","DFS","BFS"]
},
{
    question:"Which sorting algorithm has O(n log n) average complexity?",
    options:["Merge Sort","Bubble Sort","Selection Sort","Insertion Sort"]
},
{
    question:"Which device is an output device?",
    options:["Monitor","Keyboard","Mouse","Scanner"]
},
{
    question:"Which OS is open source?",
    options:["Linux","Windows","DOS","macOS"]
},
{
    question:"Which keyword declares a variable in JavaScript?",
    options:["var","int","char","float"]
}
];

// Shuffle questions
questions.sort(() => Math.random() - 0.5);

let currentQuestion = 0;

function loadQuestion() {

    document.getElementById("question").innerText =
        questions[currentQuestion].question;

    document.getElementById("op1").innerText =
        "A. " + questions[currentQuestion].options[0];

    document.getElementById("op2").innerText =
        "B. " + questions[currentQuestion].options[1];

    document.getElementById("op3").innerText =
        "C. " + questions[currentQuestion].options[2];

    document.getElementById("op4").innerText =
        "D. " + questions[currentQuestion].options[3];
}

loadQuestion();

function loadQuestion() {

    answered = false;

    const buttons = document.querySelectorAll(".options button");

    document.getElementById("question").innerText =
        questions[currentQuestion].question;

    buttons.forEach((btn, index) => {
        btn.innerText = String.fromCharCode(65 + index) + ". " + questions[currentQuestion].options[index];

        btn.disabled = false;          // Enable buttons
        btn.style.background = "#374151"; // Reset color
    });

}
const buttons = document.querySelectorAll(".options button");

buttons.forEach(button => {

    button.addEventListener("click", function(){

        if(answered) return;

        answered = true;

        this.style.background = "#22c55e"; // Selected option becomes green

        buttons.forEach(btn=>{
            btn.disabled = true; // Lock all options
        });

    });

});
function nextQuestion(){

    currentQuestion++;

    if(currentQuestion < questions.length){

        loadQuestion();

    }else{

        alert("Quiz Completed!");

    }

}
</script>
